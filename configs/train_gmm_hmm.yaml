# Classical course baseline: MFCC + GMM-HMM (hrasr/gmm_hmm.py, scripts/train_gmm_hmm.py). Runs on CPU.

seed: 20261119
features: mfcc            # 13 MFCC + deltas + delta-deltas, per-utterance CMVN

train:
  # number of Viterbi re-estimation iterations at each mixture size (the first one starts from a flat start)
  schedule:
    - {gaussians: 1, iterations: 5}
    - {gaussians: 2, iterations: 3}
    - {gaussians: 4, iterations: 3}
    - {gaussians: 8, iterations: 3}
    - {gaussians: 16, iterations: 3}
  var_floor: 1.0e-3
  lm_add_k: 0.1           # add-k smoothing of the character bigram LM

# decoding settings chosen on dev (grid), then used once on test
dev_search:
  # A first run searched lm_weight 2-15 and ins_penalty 0 to -20: the best dev WER was at the edge of that
  # grid (lm_weight 15, ins_penalty 0), with far fewer words than the references. So the grid goes further
  # on both sides (a positive ins_penalty is a bonus for each new character). Chosen on dev only.
  # With selection by dev CER (below), the best setting of that grid was lm_weight 5, ins_penalty 0: the
  # lowest lm_weight of the grid. So the grid also has lm_weight 0-3 (0 = no LM) and ins_penalty -20.
  lm_weight: [0.0, 1.0, 2.0, 3.0, 5.0, 10.0, 15.0, 20.0, 30.0, 40.0]
  ins_penalty: [-20.0, -10.0, 0.0, 10.0, 20.0]

# The metric that chooses the decoding setting on dev. Dev WER of this character model is 95.6-100.8%
# for every setting of the grid (second run, results/train_logs/hrasr-03-gmm-hmm.kaggle.log): WER is
# saturated and cannot tell the settings apart. The lowest dev WER (lm_weight 40, ins_penalty 20) was a
# setting that writes a third of the reference words, with dev CER 83.4%, against 56.1% for lm_weight
# 15, ins_penalty 0. So CER chooses; WER and CER are logged for every setting. Test is not used here.
dev_select_by: cer
